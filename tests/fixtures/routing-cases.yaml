    category: ui
    description: Basic AI dashboard with cards, numbers and labels.
    factors:
      structural_precision: 0.9
      text_accuracy: 1.0
      data_accuracy: 1.0
      timing_precision: 1.0
      editability_requirement: 0.8
    shot:
      id: S001
      on_screen_text: "Q3 REVENUE $1.2M / GROWTH 34%"
      visual_description: "AI dashboard with metric cards, bar charts and a grid layout, dark background, precise alignment"
      camera: static
      motion: "cards stagger in with spring, numbers tick up in sync with beats"
      audio: {sync_points: ["00:03 number tick"], sfx: ["tick"], voiceover: {present: false}}
      notes: "Layer Intent: BG: dark; UI: cards; DATA: numbers; Editability: HIGH"
      visual_direction: {intent: "UI dashboard", editability: HIGH, reason: "metrics change every release"}
    context:
      production_mode: PRODUCT_TECH_SHORT
    expected_routes: [REMOTION]
    acceptable_alternatives: []
    must_not_route: [GENERATIVE_VIDEO, REAL_FOOTAGE]
    reason: "UI 卡片 / 数字 / 精确对齐与帧级同步必须程序化产出；生成式无法保证逐字准确。"

