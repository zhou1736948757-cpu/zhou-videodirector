# routing-cases.yaml — Phase-3 Shot / Layer Router Benchmark Fixture (P3-5)
#
# 来源：Phase-3 Prompt §75（Test 1-15 案例）、§76（Stress Test 类别覆盖清单）、
#       §77（Benchmark case 格式）、§78（acceptable alternatives / 避开明显错误优先）。
#
# 共享契约：
#   Route 枚举     : REMOTION | THREE_D | REAL_FOOTAGE | GENERATIVE_VIDEO | JY_NATIVE | HYBRID
#   12 项因子      : 0.0-1.0（factors 只列关键项；缺失项在文档层默认 0.2，引擎另行从 shot 文本推导）
#   Confidence     : >=0.80 HIGH / 0.55-0.79 MEDIUM / <0.55 LOW
#
# 判定口径（与 scripts/routing-benchmark.py 一致，§78）：
#   pass      : 引擎 route ∈ expected_routes ∪ acceptable_alternatives，且 ∉ must_not_route
#   soft_pass : route ∈ acceptable_alternatives 但 ∉ expected_routes（备选命中，记为警告）
#   fail      : route ∈ must_not_route（严重）或 ∉ expected ∪ acceptable（偏离）
#   must_not 规避率：引擎 route ∉ must_not_route 的 case 占比（§78：重点是避开明显错误）
#
# 可选字段（不影响路由判定，仅作为附加检查信息）：
#   expect_confidence_max / expect_confidence_min / expect_prototype_required / expect_route_source
#
# 类别覆盖（§76）：ui / human / street / nature / map / chart / product / 3D / archive /
#   documentary / paper-cut / ai_dream / data_viz / logo / subtitle / photo / social /
#   cinematic / particles / interface / diagram
schema_version: 1
route_enum: [REMOTION, THREE_D, REAL_FOOTAGE, GENERATIVE_VIDEO, JY_NATIVE, HYBRID]

