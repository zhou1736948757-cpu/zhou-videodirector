# ============================================================
# ZHOU_Videodirector — dependencies.yaml
# 机器可读依赖 / 参考地图（Phase 1 版）
# ------------------------------------------------------------
# 依据:
#   - 总设计 v0.2 §68 / §69 / §70 / §71（Reference & Reuse Map）
#   - Phase-1 Prompt §33（字段定义）
# 每条参考字段:
#   name / url / integration_mode / role / status / reuse /
#   do_not / license_notes / required_phase
# integration_mode 枚举（v0.2 §62）:
#   EXTERNAL_SKILL | PROVIDER | KNOWLEDGE_ADAPTER |
#   ARCHITECTURE_REFERENCE | TIMELINE_BACKEND | RESOURCE_PROVIDER
# status 枚举: planned（规划）| discovered（本机已发现）|
#   experimental（实验）| deferred（推迟）
# required_phase 标注该依赖首次使用的 Phase（v0.2 §64）
# ============================================================

version: "1.0"
phase: 1
updated: "2026-08-15"

# ---------- C. 主设计版本说明 ----------
design_documents:
  - path: docs/design/ZHOU_Videodirector_总设计_v0.2.md
    version: v0.2
    authoritative: true
    note: 主设计文档，冲突时以 v0.2 为准
  - path: /Users/mac/Downloads/ZHOU_Videodirector_开发总目标与系统设计_v0.1.md
    version: v0.1
    authoritative: false
    note: 旧版，不引入仓库；v0.2 > v0.1

