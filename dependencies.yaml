# ---------- B. 本机能力（Phase 1 discovered，无需 Clone） ----------
local_capabilities:

  # remotion 官方技能族（11 个，EXTERNAL_SKILL，Phase 5 Motion Engine 用）
  remotion_skills:
    mode: EXTERNAL_SKILL
    role: remotion_production_skills
    status: discovered
    required_phase: 5
    items:
      - remotion-best-practices
      - remotion-captions
      - remotion-create
      - remotion-docs
      - remotion-interactivity
      - remotion-maps
      - remotion-markup
      - remotion-multimedia
      - remotion-render
      - remotion-saas
      - remotion-upgrade

  video-analyst:
    mode: EXTERNAL_SKILL
    role: reference_analysis_local_video
    status: discovered
    required_phase: 2
    location: /Users/mac/.agents/skills/video-analyst
    note: Reference Analysis 阶段调用（ASR / 抽帧 / 分析报告）

  ds-vision-skill:
    mode: EXTERNAL_SKILL
    role: visual_fallback
    status: discovered
    required_phase: 2
    location: /Users/mac/.agents/skills/ds-vision-skill
    note: 识别参考图片 / 截图 / 分镜图等视觉输入

  human-voice:
    mode: EXTERNAL_SKILL
    role: voiceover_candidate
    status: discovered
    required_phase: 6
    location: /Users/mac/skills/human-voice
    note: voiceover 候选能力，Phase 6 Voice-over 流程评估

  yt-dlp:
    mode: PROVIDER
    role: video_download_cli
    status: discovered
    required_phase: 2
    location: /Users/mac/skills/yt-dlp
    note: 参考视频下载 exec；配合 video-analyst 使用，不作为唯一下载方案

  ffmpeg-ffprobe:
    mode: PROVIDER
    role: video_probe_normalize_proxy_review
    status: discovered
    required_phase: 6
    location: /opt/homebrew/bin/ffmpeg + /opt/homebrew/bin/ffprobe
    version: 8.x
    install: brew install ffmpeg
    note: Phase 6 运行时依赖（homebrew 8.x）；modules/external-visual 的 probe/
          normalize/proxy 与 review.machine_checks 全部经 subprocess 调用；
          缺失时模块输出可读错误而非崩溃（ingestion.py / review.py）

  generative-video-providers-config:
    mode: PROVIDER
    role: generative_video_provider_capability_config
    status: discovered
    required_phase: 6
    location: /Users/mac/skills/ZHOU_Videodirector/providers/generative-video/
    note: provider-neutral 能力配置目录（§28 配置层可写模型名；禁止 endpoint/key
          占位）。adapters/generative-video.load_providers(config_dir) 读取；
          template.yaml 为可复制模板；本目录只存能力声明，引擎不调用任何第三方 API。
