# 只描述"用户自行在网页端生成并返回文件"这一通道的通用参数范围。
# 参数范围取常见通用值，不代表任何具体厂商；不涉及任何 API / 凭据 / 费用。

provider_id: manual-web
name: Manual Web Generation (Generic)
model: UNKNOWN
text_to_video: true
image_to_video: true
first_last_frame: false
reference_image: true
character_reference: false
