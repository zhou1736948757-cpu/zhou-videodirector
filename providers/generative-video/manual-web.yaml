api_available: false
manual_generation_supported: true
negative_prompt_supported: true
max_prompt_length: 2000
notes: "通用人工生成通道：ZHOU 导出 prompt/instructions，用户在网页端生成并把文件放回，交给 P6-04 ingest（§29）。"
status: active
